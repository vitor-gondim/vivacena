<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Viva Cena</title>
    <link rel="stylesheet" href="estilizacao/stylecriarconta.css" >
</head>

<body>
    <header class="cabecalho">
        <img src="imagens/Logo.png" alt="Logotipo do Festival Viva Cena" height="80" class="logo">
        <div class="textos-cabecalho">
            <h1>Festival Viva Cena</h1>
            <p>Música, Teatro e Cinema nos dias 16, 17 e 18 de julho de 2027.</p>
        </div>
    </header>

    <main>
        <section class="sessao-criar">
            <h2>Crie sua Conta</h2>
            <form action="login.html" method="get">
                <label for="nome">Seu nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email-login">E-mail:</label>
                <input type="email" id="email-login" name="email-login" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit" class="btn-entrar" >Criar conta</button>
            </form>
            <p class="">Ao criar sua conta você concorda com os Termos e Condições</p>
        </section>
    </main>

<footer>
    <p>Festival Viva Cena — Todos os direitos reservados | 2027</p>
    <p>contato@vivacena.com.br</p>
</footer>
</body>

</html>
