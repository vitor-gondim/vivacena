<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Viva Cena</title>
    <link rel="stylesheet" href="estilizacao/stylelogin.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <header class="cabecalho">
        <img src="imagens/Logo.png" alt="Logotipo do Festival Viva Cena" height="80" class="logo">
        <div class="textos-cabecalho">
            <h1>Festival Viva Cena</h1>
            <p>Música, Teatro e Cinema nos dias 16, 17 e 18 de julho de 2027.</p>
        </div>
    </header>

    <nav class="menu">
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre o Festival</a>
        <a href="musica.html">Música</a>
        <a href="teatro.html">Teatro</a>
        <a href="cinema.html">Cinema</a>
        <a href="contato.html">Contato</a>
        <a class="pagina-atual" href="login.html" style="display: inline-flex; align-items: center;">
  <span class="material-symbols-outlined">account_circle</span>
</a>
    </nav>

    <main>
        <section class="sessao-login">
            <h2>Faça seu Login</h2>
            <form action="#" method="get">
                <label for="email-login">E-mail:</label>
                <input type="email" id="email-login" name="email-login" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit" class="btn-entrar">Entrar</button>
            </form>
            <p class="ajuda-login"><a href="redefinir.html">Esqueci minha senha</a> | <a href="#">Criar uma conta</a></p>
        </section>
    </main>

<footer>
    <p>Festival Viva Cena — Todos os direitos reservados | 2027</p>
    <p>contato@vivacena.com.br</p>
</footer>
</body>

</html>
