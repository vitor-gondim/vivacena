<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acesso | Viva Cena</title>
    <link rel="stylesheet" href="estilizacao/styleredefinir.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <main class="container-foco">
        <section class="card-redefinir-isolado">
            
            <div class="marca-isolada">
                <h1>Viva Cena</h1>
                <span class="material-symbols-outlined icone-cadeado">lock_reset</span>
            </div>

            <h2>Recuperar Acesso</h2>
            <p class="instrucoes">Fique tranquilo! Digite o e-mail cadastrado e enviaremos as instruções para você criar uma nova senha.</p>
            
            <form action="#" method="get">
                <div class="grupo-input">
                    <label for="email-recuperacao">Seu e-mail de acesso</label>
                    <input type="email" id="email-recuperacao" name="email-recuperacao" placeholder="exemplo@email.com" required>
                </div>

                <button type="submit" class="btn-enviar-destaque">
                    Enviar link mágico
                    <span class="material-symbols-outlined">send</span>
                </button>
            </form>
            
            <div class="rodape-card">
                <a href="login.html" class="link-voltar">
                    <span class="material-symbols-outlined">arrow_back</span>
                    Voltar para o Login
                </a>
            </div>
            
        </section>
    </main>

    <footer>
        <p>Festival Viva Cena — Todos os direitos reservados | 2027</p>
        <p>contato@vivacena.com.br</p>
    </footer>
</body>

</html>
